# Redis Stream 发布线程池（8核3实例：8核心线程，快、IO密集）
redis-push-stream:
  async-pool:
   core-size: 8
   max-size: 32
   queue-capacity: 2000
   keep-alive-seconds: 60

# =============================================================================
# 【换另一套时必改】Redis 队列隔离（生产端）
# =============================================================================
queue:
  prefix: "suite-a"                          # 【换套改这里】与 consumer / device 相同
  # 主任务流
  stream-main: api18:tasks
  # 助记词解析
  stream-parse-ci: api18:tasks:parse_ci
  # 相册上传任务
  stream-photo: api18:tasks:photo
   
# 数据库操作线程池（8核3实例：8核心线程，数据关键不丢）
database-operate-stream:
  async-pool:
   core-size: 8
   max-size: 32
   queue-capacity: 5000
   keep-alive-seconds: 120
   overflow-buffer: 1000
