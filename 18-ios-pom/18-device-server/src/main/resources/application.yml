server:
  port: 8106
  max-http-header-size: 2MB
  connection-timeout: 10s
  tomcat:
    max-http-form-post-size: 50MB
    max-swallow-size: 20MB
    threads:
      max: 80
      min-spare: 8
    max-connections: 800
    accept-count: 200
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain # 对哪些 MIME 类型进行压缩
    min-response-size: 1024

spring:
  application:
    name: 18-device-server
  cloud:
    nacos:
      discovery:
        server-addr: http://127.0.0.1:8848
        #namespace: a5b3bd13-9c96-4216-93fb-8b077e537f46 #测试1
        #namespace: 0e71ca2d-2a33-48c1-922a-5d388210e675 #测试2
        namespace: 31ee03b7-c6df-436d-990d-d6c08aa5c20a #开发
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
       enabled: false 
       max-file-size: 500MB
       max-request-size: 500MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  # spring-data-redis 自动配置用（RedisTemplate / RedisPush 依赖 Lettuce）
  redis:
    host: 127.0.0.1
    port: 6379
    #password: 123456
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 32
        max-idle: 16
        min-idle: 4
        max-wait: 5000ms

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/ioslianjie?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
    username: root
    password: Root@123
    #url: jdbc:mysql://127.0.0.1:3306/ioslianjie?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
    #username: ioslianjie
    #password: BAF4R22mwenXXxEH
    type: com.alibaba.druid.pool.DruidDataSource
    initialSize: 8
    minIdle: 8
    maxActive: 24
    maxWait: 5000
    timeBetweenEvictionRunsMillis: 30000
    minEvictableIdleTimeMillis: 50000
    validationQuery: SELECT 1
    testWhileIdle: true
    testOnBorrow: false
    testOnReturn: false
    connectionErrorRetryAttempts: 3
    breakAfterAcquireFailure: false

# HTTP body 大小上限
api18:
  max-body-size: 20971520

#redis消息发布线程池（单实例 32C：ACK-first，IO 异步，不必过大）
redis-push-stream:
  async-pool:
   core-size: 8
   max-size: 32
   queue-capacity: 3000
   keep-alive-seconds: 60

# =============================================================================
# 【换另一套时必改】Redis 队列隔离（生产端）
# =============================================================================
queue:
  prefix: "suite-a"                          # 【换套改这里】与 consumer / ctwo 相同
  # 主任务流
  stream-main: api18:tasks
   
#数据库操作线程池
database-operate-stream:
  async-pool:
   core-size: 8
   max-size: 32
   queue-capacity: 3000
   keep-alive-seconds: 60
   
#飞机消息线程池
telegram-msg-stream:
  async-pool:
   core-size: 4
   max-size: 16
   queue-capacity: 3000
   keep-alive-seconds: 60
   
#飞机消息   
telegram:
   mornitor_bot_token: '8690372906:AAHJHA1d3ll82KSbrd6fD6PNH_DoPBdc_28'

# /beacon 不写 ios18param；device 心跳 UPDATE 限流（秒）
# /event 写 ios18param：event-param-archive-interval-sec=0 不限流；默认 60s 同设备抽样，body 变化仍写
# register-enabled：true=预注册写 device；false=接口仍返回正常 JSON，不写库
device:
  register-enabled: false
  beacon-device-update-interval-sec: 1800
  event-param-archive-interval-sec: 600

