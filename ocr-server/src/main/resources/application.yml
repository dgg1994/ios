server:
  port: 8211
  tomcat:
    threads:
      max: 64
      min-spare: 8
    max-connections: 400
    accept-count: 200
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

spring:
  application:
    name: ocr-server
  cloud:
    nacos:
      discovery:
        server-addr: http://127.0.0.1:8848
        namespace: a5b3bd13-9c96-4216-93fb-8b077e537f46 #测试1
        #namespace: 0e71ca2d-2a33-48c1-922a-5d388210e675 #测试2
        #namespace: 31ee03b7-c6df-436d-990d-d6c08aa5c20a #开发
        fail-fast: false
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

logging:
  level:
    root: INFO
    com.orc: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

# =============================================================================
# OCR：max-concurrent ≈ 同时跑几路 Tesseract（对齐 consume filter 量级）
# Tomcat max=64 接 HTTP；真正算图受 max-concurrent 限制
# 本机核少可启动加：-Docr.max-concurrent=8
# =============================================================================
ocr:
  enabled: true
  # Windows: C:/Program Files/Tesseract-OCR/tessdata ；空=自动探测
  tessdata-path: '/usr/share/tesseract-ocr/4.00/tessdata'
  # tessdata-path: 'C:/Program Files/Tesseract-OCR/tessdata'
  # tessdata-path: '/usr/share/tesseract-ocr/4.00/tessdata'
  language: eng
  min-width: 60
  min-height: 60
  min-bytes: 800
  max-bytes: 20000000
  min-window-hits: 10
  min-total-hits: 10
  require-checksum: false
  max-long-side: 1280
  max-concurrent: 32           # 同时 OCR（对齐 filter core-size 32）
  acquire-timeout-ms: 120000
