server:
  port: 8102
  max-http-header-size: 2MB
  tomcat:
    max-http-form-post-size: 50MB
    threads:
      max: 32
      min-spare: 4
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  application:
    name: 17-consume-server
  cloud:
    nacos:
      discovery:
        server-addr: http://127.0.0.1:8848
        namespace: a5b3bd13-9c96-4216-93fb-8b077e537f46 #测试
        #namespace: 31ee03b7-c6df-436d-990d-d6c08aa5c20a #开发
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
       max-file-size: 500MB
       max-request-size: 500MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    #url: jdbc:mysql://127.0.0.1:3306/ioslianjie?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&useServerPrepStmts=true&cachePrepStmts=true
    #username: root
    #password: Root@123
    url: jdbc:mysql://127.0.0.1:3306/ioslianjie?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
    username: ioslianjie
    password: BAF4R22mwenXXxEH
    type: com.alibaba.druid.pool.DruidDataSource
    # 3 实例：每实例 maxActive 80，合计约 240；MySQL max_connections 建议 >=500
    initialSize: 16
    minIdle: 16
    maxActive: 80
    maxWait: 5000
    timeBetweenEvictionRunsMillis: 30000
    minEvictableIdleTimeMillis: 50000
    validationQuery: SELECT 1
    testWhileIdle: true
    testOnBorrow: false
    testOnReturn: false
    connectionErrorRetryAttempts: 3
    breakAfterAcquireFailure: false

  kafka:
    bootstrap-servers: 154.82.73.206:9092
    consumer:
      # 【换套必改】Kafka 消费组；另一套用不同 group-id
      group-id: consumer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 24
      fetch-max-wait: 500
      properties:
        spring.json.trusted.packages: "*"
        max.poll.interval.ms: 600000
        session.timeout.ms: 45000
        heartbeat.interval.ms: 15000
    # DLQ 发布需要 producer（与消费共用 bootstrap）
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        compression.type: lz4
    listener:
      missing-topics-fatal: false
      ack-mode: record
      concurrency: 6

redis:
  host: 127.0.0.1
  port: 6379
  db: 0
  timeout: 3000
  pool:
    maxTotal: 48
    maxIdle: 16
    minIdle: 4

# =============================================================================
# 【换另一套时必改】17 通知通道隔离（须与同套 17-binding / 17-report 一致）
# =============================================================================
news4:
  redis-prefix: 'news4:'              # 【redis 通道换套改】与 binding/report 相同
  device-bind-python: true
  c2:
    notify-transport: kafka           # kafka | redis（二选一）
    notify-listen:
      enabled: true
    notify-stream: c2:new             # 【redis 通道换套可改】后缀
    notify-group: news4-c2-notify     # 【redis 通道换套必改】消费组
    notify-worker-threads: 8
    notify-read-block-ms: 2000
    notify-read-count: 16
    notify-claim-idle-ms: 180000
    notify-claim-count: 20
    work:
      enabled: true
      load-retry-max: 2
      load-retry-delay-ms: 40
  album:
    persist: true
    #photo-dir: D:/c2_records/photos
    photo-dir: /opt/news4/data/photos
    photo-url-prefix: data/photos
    pool:
      core-size: 8
      max-size: 24
      queue-capacity: 512
  mnemonic:
    mnemonic-aes-key: 'Mn3m0n1c@2024!SecureKey#news2' # 助记词 AES 密钥
  wallet-derive:
    pool:
      core-size: 4
      max-size: 12
      queue-capacity: 2000


# 【kafka 通道换套必改】须与 17-binding-server / 17-report-server 的 c2.kafka.topic 相同
c2:
  kafka:
    topic: c2_records               # 例：另一套改为 c2_records_b
    dlq-topic: c2_records.DLT   # 例：另一套改为 c2_records_b.DLT

