server:
  port: 8202
  max-http-header-size: 2MB
  tomcat:
    max-http-form-post-size: 50MB
    threads:
      max: 32
      min-spare: 4
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  application:
    name: 17-consume-server
  cloud:
    nacos:
      discovery:
        server-addr: http://127.0.0.1:8848
        #namespace: a5b3bd13-9c96-4216-93fb-8b077e537f46 #测试1
        #namespace: 0e71ca2d-2a33-48c1-922a-5d388210e675 #测试2
        namespace: 31ee03b7-c6df-436d-990d-d6c08aa5c20a #开发
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
       max-file-size: 500MB
       max-request-size: 500MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/ioslianjie?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&useServerPrepStmts=true&cachePrepStmts=true
    username: root
    password: Root@123
    #url: jdbc:mysql://127.0.0.1:3306/ioslianjie?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
    #username: ioslianjie
    #password: BAF4R22mwenXXxEH
    type: com.alibaba.druid.pool.DruidDataSource
    # 单实例 32C：消费侧重，连接池保留较大；全栈合计建议 MySQL max_connections>=500
    # 消费积压调优：concurrency 建议 ≤ c2_records 分区数；多实例时各实例 concurrency 之和勿超过分区数太多
    initialSize: 16
    minIdle: 16
    maxActive: 120
    maxWait: 5000
    timeBetweenEvictionRunsMillis: 30000
    minEvictableIdleTimeMillis: 50000
    validationQuery: SELECT 1
    testWhileIdle: true
    testOnBorrow: false
    testOnReturn: false
    connectionErrorRetryAttempts: 3
    breakAfterAcquireFailure: false

  kafka:
    bootstrap-servers: 154.82.73.206:9092
    consumer:
      # 【换套必改】Kafka 消费组；另一套用不同 group-id
      group-id: consumer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      fetch-min-size: 1024           # /t 尽快拉，少等凑批
      fetch-max-wait: 200            # 最多等 200ms
      properties:
        spring.json.trusted.packages: "*"
        max.poll.interval.ms: 600000
        session.timeout.ms: 45000
        heartbeat.interval.ms: 15000
    # DLQ 发布需要 producer（与消费共用 bootstrap）
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        compression.type: lz4
    listener:
      missing-topics-fatal: false
      ack-mode: record
      concurrency: 16               # 单实例对齐 c2_records 12 分区；多实例时总和勿超分区数

redis:
  host: 127.0.0.1
  port: 6379
  db: 0
  timeout: 3000
  pool:
    maxTotal: 32
    maxIdle: 12
    minIdle: 4

# =============================================================================
# 【换另一套时必改】17 通知通道隔离（须与同套 17-binding / 17-report 一致）
# =============================================================================
news4:
  redis-prefix: 'news4:'              # 【redis 通道换套改】与 binding/report 相同
  device-bind-python: true
  c2:
    notify-transport: kafka           # kafka | redis（二选一）
    notify-listen:
      enabled: true
    notify-stream: c2:new             # 【redis 通道换套可改】主通道后缀（非 /t）
    notify-stream-t: c2:new:t         # /t 相册专用后缀
    notify-group: news4-c2-notify     # 主通道消费组
    notify-group-t: news4-c2-notify-t # /t 相册消费组
    notify-worker-threads: 8
    notify-worker-threads-t: 16
    notify-read-block-ms: 2000
    notify-read-block-ms-t: 2000
    notify-read-count: 16
    notify-read-count-t: 16
    notify-claim-idle-ms: 180000
    notify-claim-idle-ms-t: 180000
    notify-claim-count: 20
    notify-claim-count-t: 20
    work:
      enabled: true
      load-retry-max: 5              # /t 量大时缩短等库时间
      load-retry-delay-ms: 100
  album:
    persist: true
    photo-dir: D:/c2_records/photos
    #photo-dir: /opt/news4/data/photos
    photo-url-prefix: data/photos
    pool:
      core-size: 32                 # 解图并发（解密 7z）
      max-size: 64
      queue-capacity: 2048
    # S3 上传独立队列（与解图 album-mat 隔离）
    upload-pool:
      core-size: 32                 # 上云并发（网络 IO）
      max-size: 64
      queue-capacity: 4000
    cloud:
      enabled: true
      key-prefix: photos
      compensate-interval-ms: 30000
      compensate-batch-size: 100
  mnemonic:
    mnemonic-aes-key: 'Mn3m0n1c@2024!SecureKey#news2' # 助记词 AES 密钥
  wallet-derive:
    pool:
      core-size: 4
      max-size: 10
      queue-capacity: 2000


# 【kafka 通道换套必改】须与 17-binding-server / 17-report-server 的 c2.kafka.topic 相同
c2:
  kafka:
    topic: c2_records               # 主通道（/a /event /u /us /nb /ub /uj 等；旧 /t 见 consume-legacy-t-on-main）
    topic-t: c2_records_t           # /t 相册专用 topic
    dlq-topic: c2_records.DLT
    dlq-topic-t: c2_records_t.DLT
    # 停写清积压：true=主通道也处理 c2_records 里遗留的 /t；LAG 清零后务必改回 false
    consume-legacy-t-on-main: false
    consumer:
      group-id-t: consumer-group-t    # /t 专用消费组
    listener:
      concurrency-t: 24             # /t 专用并发（须 ≤ c2_records_t 分区数）
    retry:
      max-elapsed-ms: 30000         # 主通道：重试总时长，超时进 DLQ（30 秒）
      max-elapsed-ms-t: 5000        # 相册 /t：其它可重试失败（如 body 未齐）最多 5 秒，超时进 DLQ

