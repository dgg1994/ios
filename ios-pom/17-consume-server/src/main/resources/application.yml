server:
  port: 8402
  max-http-header-size: 2MB
  tomcat:
    max-http-form-post-size: 50MB
    threads:
      max: 32
      min-spare: 4
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

logging:
  level:
    root: INFO
    com.consume: INFO
    org.apache.kafka: WARN
    org.apache.kafka.clients.consumer.ConsumerConfig: ERROR
    org.apache.kafka.clients.producer.ProducerConfig: ERROR
    org.apache.kafka.common.utils.AppInfoParser: WARN
    org.springframework.kafka: WARN
    com.amazonaws: WARN
    com.amazonaws.util.Base64: ERROR
    com.amazonaws.services.s3: WARN

spring:
  application:
    name: 17-consume-server
  cloud:
    nacos:
      discovery:
        server-addr: http://127.0.0.1:8848
        namespace: a5b3bd13-9c96-4216-93fb-8b077e537f46 #测试1
        #namespace: 0e71ca2d-2a33-48c1-922a-5d388210e675 #测试2
        #namespace: 31ee03b7-c6df-436d-990d-d6c08aa5c20a #开发
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  # ---------------------------------------------------------------------------
  # 2. 基础设施（MySQL / Redis / Kafka 连接；换环境主要改这里）
  # ---------------------------------------------------------------------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    #url: jdbc:mysql://127.0.0.1:3306/ioslianjie?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&useServerPrepStmts=true&cachePrepStmts=true
    #username: root
    #password: Root@123
    url: jdbc:mysql://127.0.0.1:3306/ioslianjie?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
    username: ioslianjie
    password: BAF4R22mwenXXxEH
    type: com.alibaba.druid.pool.DruidDataSource
    initialSize: 16
    minIdle: 16
    maxActive: 120
    maxWait: 5000
    timeBetweenEvictionRunsMillis: 30000
    minEvictableIdleTimeMillis: 50000
    validationQuery: SELECT 1
    testWhileIdle: true
    testOnBorrow: false
    testOnReturn: false
    connectionErrorRetryAttempts: 3
    breakAfterAcquireFailure: false

  kafka:
    bootstrap-servers: 154.82.73.206:9092
    consumer:
      group-id: consumer-group          # 【换套必改】主通道消费组
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500 
      fetch-min-size: 1024
      fetch-max-wait: 200
      properties:
        spring.json.trusted.packages: "*"
        max.poll.interval.ms: 600000
        session.timeout.ms: 45000
        heartbeat.interval.ms: 15000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        compression.type: lz4
    listener:
      missing-topics-fatal: false
      ack-mode: record
      concurrency: 16                  # 主通道并发（≤ 主 topic 分区数）

redis:
  host: 127.0.0.1
  port: 6379
  password: 123456
  db: 0
  timeout: 3000
  pool:
    maxTotal: 96
    maxIdle: 32
    minIdle: 8

# =============================================================================
# 3. 【常调】双机角色 + 吞吐（压测/扩容优先改这一段）
# =============================================================================
c2:
  # --- 角色开关（同包双机；也可用启动参数覆盖）---
  # 主机：  main-enabled=true  album-enabled=false
  # 相册机：main-enabled=false album-enabled=true
  # 单机：  两者都 true（勿两台相册机同进 consumer-group-t）
  channel:
    main-enabled: false
    album-enabled: true
  kafka:
    # --- Topic / 组 / DLQ（换套与 binding/report 对齐）---
    topic: c2_records
    topic-t: c2_records_t
    dlq-topic: c2_records.DLT
    dlq-topic-t: c2_records_t.DLT
    consumer:
      group-id-t: consumer-group-t
      # --- 相册 Kafka 成套（仅相册 ConsumerFactory）---
      max-poll-records-t: 100           # 过大→CommitFailed；过小→LAG 慢
      max-poll-interval-ms-t: 300000    # 5 分钟
      session-timeout-ms-t: 60000
      heartbeat-interval-ms-t: 20000
      request-timeout-ms-t: 120000
      default-api-timeout-ms-t: 120000
    listener:
      concurrency-t: 20                 # 相册并发；CommitFailed 多可降到 16
    retry:
      max-elapsed-ms: 10000
      max-elapsed-ms-t: 5000

news4:
  redis-prefix: 'news4:'                # 【换套】与 binding/report 相同
  device-bind-python: true
  album:
    pool:                               # 解图（7z）
      core-size: 32
      max-size: 64
      queue-capacity: 2048
    filter-pool:                        # OCR+BIP39；瓶颈时优先加这里
      core-size: 32
      max-size: 64
      queue-capacity: 4096
    upload-pool:                        # S3
      core-size: 32
      max-size: 64
      queue-capacity: 4000
    # --- 相册路径 / 过滤规则 / 上云落库 ---
    #photo-dir: D:/c2_records/photos
    photo-dir: /opt/news4/data/photos
    photo-url-prefix: data/photos
    mnemonic-filter:
      enabled: true
      # Windows: C:/Program Files/Tesseract-OCR/tessdata ；空=自动探测 
      tessdata-path: '/usr/share/tesseract-ocr/4.00/tessdata'
      ocr-language: eng
      min-width: 60
      min-height: 60
      min-bytes: 800
      max-bytes: 20000000
      min-window-hits: 10
      min-total-hits: 10
      require-checksum: false
    cloud:
      enabled: true
      key-prefix: photos
      batch-insert-enabled: true
      batch-insert-size: 50
      batch-insert-interval-ms: 200
  # --- C2 通知运输（kafka|redis）与 Redis Stream（仅 redis 时用）---
  c2:
    notify-transport: redis
    notify-listen:
      enabled: true
    notify-stream: c2:new
    notify-stream-t: c2:new:t
    notify-group: news4-c2-notify
    notify-group-t: news4-c2-notify-t
    # Redis 消费吞吐（对标 Kafka concurrency / max-poll-records）
    notify-worker-threads: 12           # 主通道
    notify-worker-threads-t: 28         # 相册；勿超过 CPU 核数太多
    notify-read-count: 32               # 主每次 XREADGROUP 条数
    notify-read-count-t: 48             # 相册每次拉取
    notify-read-block-ms: 1000
    notify-read-block-ms-t: 1000        # 有货时更快醒来
    notify-claim-idle-ms: 180000
    notify-claim-idle-ms-t: 180000
    notify-claim-count: 32
    notify-claim-count-t: 32
    work:
      enabled: true
      load-retry-max: 5
      load-retry-delay-ms: 100

  mnemonic:
    mnemonic-aes-key: 'Mn3m0n1c@2024!SecureKey#news2'
  wallet-derive:
    pool:
      core-size: 4
      max-size: 10
      queue-capacity: 2000

