server:
  port: 8104
  max-http-header-size: 2MB
  tomcat:
    max-http-form-post-size: 50MB
    threads:
      max: 120
      min-spare: 20
    max-connections: 800
    accept-count: 200
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  application:
    name: 17-report-server
    
  cloud:
    nacos:
      discovery:
        server-addr: http://127.0.0.1:8848
        namespace: a5b3bd13-9c96-4216-93fb-8b077e537f46 #测试
        #namespace: 31ee03b7-c6df-436d-990d-d6c08aa5c20a   # 开发
  
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  
  servlet:
    multipart:
      enabled: false
      max-file-size: 500MB
      max-request-size: 500MB
  
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  
  # ========== 数据源（3 实例：每实例 maxActive 80，合计约 240；需 MySQL max_connections≥500） ==========
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    #url: jdbc:mysql://127.0.0.1:3306/ioslianjie?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&useServerPrepStmts=true&cachePrepStmts=true
    #username: root
    #password: Root@123
    url: jdbc:mysql://127.0.0.1:3306/ioslianjie?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
    username: ioslianjie
    password: BAF4R22mwenXXxEH
    type: com.alibaba.druid.pool.DruidDataSource
    initialSize: 16
    minIdle: 16
    maxActive: 80
    maxWait: 5000
    timeBetweenEvictionRunsMillis: 30000
    minEvictableIdleTimeMillis: 50000
    validationQuery: SELECT 1
    testWhileIdle: true
    testOnBorrow: false
    testOnReturn: false
    connectionErrorRetryAttempts: 3
    breakAfterAcquireFailure: false
  
  # ========== Kafka 配置（生产级） ==========
  kafka:
    bootstrap-servers: 154.82.73.206:9092
    # 生产者配置
    producer:
      # 序列化
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 可靠性配置
      acks: all                         # 所有副本确认，最强可靠性
      retries: 2147483647               # 无限重试（配合 delivery.timeout.ms）
      # 性能配置
      batch-size: 65536                 # 64KB
      buffer-memory: 268435456          # 256MB
      linger-ms: 10                     # 略降延迟，突发下仍靠 batch
      max-request-size: 1048576         # 1MB（小消息场景足够）
      # 高级配置
      properties:
        # 幂等性（防止消息重复）
        enable.idempotence: true
        # 并发请求数（无顺序要求，可提升吞吐）
        max.in.flight.requests.per.connection: 5
        # 压缩（小消息压缩率高）
        compression.type: lz4
        # 连接配置
        connections.max.idle.ms: 540000
        # 超时配置
        request.timeout.ms: 30000
        delivery.timeout.ms: 120000
        # 网络缓冲
        send.buffer.bytes: 262144       # 256KB
        receive.buffer.bytes: 65536     # 64KB

# ========== Redis 配置 ==========
redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0
  timeout: 3000
  pool:
    maxTotal: 32

report:
  dump:
    #dir: D:/c2_records                 # Windows 开发环境
    dir: /opt/news4/data/apilog       # Linux 生产环境
    headers-prefix: headers
    bodies-prefix: bodies

# ========== C2 线程池（3 实例水平扩展；单实例勿过大以免打满 MySQL） ==========
# =============================================================================
# 【换另一套时必改】与同套 17-consume / 17-binding 对齐，否则会串或消费不到
# -----------------------------------------------------------------------------
# kafka 通道：改 c2.kafka.topic（例 c2_records_b），consume 的 group-id 也建议不同
# redis 通道：改下方 news4.redis-prefix / notify-stream（与 consume 相同）
# =============================================================================
c2:
  record:
    async-pool:
      core-size: 32
      max-size: 80
      queue-capacity: 15000
      keep-alive-seconds: 60
  device-bind:
    async-pool:
      core-size: 16
      max-size: 48
      queue-capacity: 8000
      keep-alive-seconds: 60
  kafka:
    topic: c2_records              # 【kafka 换套必改】与 consume / binding 相同
    async-pool:
      core-size: 12
      max-size: 32
      queue-capacity: 10000
      keep-alive-seconds: 60
  redis-stream:
    async-pool:
      core-size: 32
      max-size: 128
      queue-capacity: 10000
      keep-alive-seconds: 60
  telegram:
    async-pool:
      core-size: 8
      max-size: 24
      queue-capacity: 5000
      keep-alive-seconds: 60
  similar:
    enabled: true
    ip-segments: 3
    version-segments: 2
    window-seconds: 300
    max-results: 10


# 【redis 通道换套必改】完整 key = redis-prefix + notify-stream，须与 17-consume 相同
news4:
  redis-prefix: 'news4:'              # 例：另一套改为 'news4b:'
  c2:
    notify-stream: c2:new

pushMsg:
  kafka: true
  redis: false

